{{- $type := .type -}}
{{- if eq $type "demo" -}}
<div class="memo-doc-flow" role="img" aria-label="输入一段自然语言，保留原话，拆成原子条目，匹配固定标签，聚合到模块、日程、清单和看板，最后浏览、搜索和后续整理">
    <div class="memo-doc-flow__track">
        <div class="memo-doc-flow__node">输入一段自然语言</div>
        <span class="memo-doc-flow__arrow" aria-hidden="true">→</span>
        <div class="memo-doc-flow__node">保留原话</div>
        <span class="memo-doc-flow__arrow" aria-hidden="true">→</span>
        <div class="memo-doc-flow__node">拆成原子条目</div>
        <span class="memo-doc-flow__arrow" aria-hidden="true">→</span>
        <div class="memo-doc-flow__node">匹配固定标签</div>
        <span class="memo-doc-flow__arrow" aria-hidden="true">→</span>
        <div class="memo-doc-flow__node">聚合到模块、日程、清单和看板</div>
        <span class="memo-doc-flow__arrow" aria-hidden="true">→</span>
        <div class="memo-doc-flow__node">浏览、搜索和后续整理</div>
    </div>
</div>
{{- else if eq $type "mvp" -}}
<div class="memo-doc-flow" role="img" aria-label="随口输入，可靠保存，自动拆解与收纳，用户看懂并纠正，通过备忘录、搜索、提问或今天找回，最后确认记下之后真的有用">
    <div class="memo-doc-flow__track">
        <div class="memo-doc-flow__node">随口输入</div>
        <span class="memo-doc-flow__arrow" aria-hidden="true">→</span>
        <div class="memo-doc-flow__node">可靠保存</div>
        <span class="memo-doc-flow__arrow" aria-hidden="true">→</span>
        <div class="memo-doc-flow__node">自动拆解与收纳</div>
        <span class="memo-doc-flow__arrow" aria-hidden="true">→</span>
        <div class="memo-doc-flow__node">用户看懂并纠正</div>
        <span class="memo-doc-flow__arrow" aria-hidden="true">→</span>
        <div class="memo-doc-flow__node">备忘录 / 搜索 / 提问 / 今天找回</div>
        <span class="memo-doc-flow__arrow" aria-hidden="true">→</span>
        <div class="memo-doc-flow__node">确认记下之后真的有用</div>
    </div>
</div>
{{- end -}}
