        <div class="skill-diagram__zoom" aria-label="流程图缩放控制">

            <output aria-live="polite">适配</output>
            <button type="button" data-diagram-zoom="in" aria-label="放大{{ .label }}"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="M15.5 15.5 21 21M7.5 10.5h6M10.5 7.5v6"></path></svg></button>
