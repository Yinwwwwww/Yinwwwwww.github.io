{{- $scenarios := hugo.Data.life_scenarios -}}
<div class="life-card-deck" data-life-card-deck>
    <div class="life-card-deck__viewport" data-life-card-viewport role="region" aria-label="20 个生活问题场景，可左右滑动查看全部卡片">
        <ol class="life-card-deck__track">
            {{- range $scenarios -}}
            <li class="life-scenario-card{{ if eq .id "01" }} is-centered{{ end }}" data-life-card>
                <div class="life-scenario-card__inner">
                    <button
                        class="life-scenario-card__face life-scenario-card__face--front"
                        type="button"
                        data-life-card-open
                        aria-expanded="false"
                        aria-controls="life-scenario-{{ .id }}"
                    >
                        <span class="life-scenario-card__eyebrow">facing problems</span>
                        <span class="life-scenario-card__number">{{ .id }}</span>
                        <strong>{{ .problem }}</strong>
                        <span class="life-scenario-card__hint">点击翻面 <i aria-hidden="true"></i></span>
                    </button>

                    <section
                        class="life-scenario-card__face life-scenario-card__face--back"
                        id="life-scenario-{{ .id }}"
                        data-life-card-back
                        aria-label="场景 {{ .id }} 的定制方案"
                        aria-hidden="true"
                        tabindex="-1"
                    >
                        <span class="life-scenario-card__back-head">
                            <strong>{{ .id }}</strong>
                            <button type="button" data-life-card-close>再次点击返回</button>
                        </span>
                        <span class="life-scenario-card__section">
                            <small>search results</small>
                            <span>{{ .search }}</span>
                        </span>
                        <span class="life-scenario-card__section">
                            <small>personal knowledge</small>
                            <span>{{ .knowledge }}</span>
                        </span>
                        <span class="life-scenario-card__section life-scenario-card__section--result">
                            <small>i want</small>
                            <span>{{ .want }}</span>
                        </span>
                    </section>
                </div>
            </li>
            {{- end -}}
        </ol>
    </div>
</div>
