- id: "01"
  problem: "木质餐桌留下胶印，想尽快清除又怕伤漆"
  search: "风油精、酒精、热风、刮刀和除胶剂都有人推荐，但适用材质和风险不同"
  knowledge: "家具材质及购买说明、除胶剂的位置和标签信息、家中有宠物且不喜欢刺激性气味"
  want: "找到现有用品并核对说明，排除高温、刮擦等不适用方法，给出“小面积测试—正式处理—通风清洁”的步骤；信息缺失时先询问"

- id: "02"
  problem: "白衬衫溅上油渍，不知道能否直接用热水洗"
  search: "网上同时推荐洗洁精、热水、漂白剂和小苏打，没有考虑面料与印花"
  knowledge: "衬衫面料、洗涤标签、印花位置、家中清洁剂及用户希望局部处理的习惯"
  want: "根据标签筛选现有清洁用品，说明处理顺序、等待时间和禁用方法，尽量避免为了一个污点整件重洗"

- id: "03"
  problem: "浴室玻璃胶出现霉斑"
  search: "含氯产品、白醋、除霉啫喱等方案互相矛盾，混用还可能产生风险"
  knowledge: "家中有猫、用户对气味敏感、浴室通风条件、现有除霉产品及有效期"
  want: "选择一种适用的现有产品，结合标签给出隔离宠物、通风、停留和冲洗步骤，并明确禁止混用"

- id: "04"
  problem: "空调不凉并伴有异味"
  search: "搜索结果会同时建议清滤网、洗蒸发器、加制冷剂或自行拆机"
  knowledge: "空调型号、说明书、上次清洗时间、出租房维修约定及房东联系方式"
  want: "先执行低风险检查和该型号允许的滤网清洁；仍异常时整理型号和故障表现，转入报修，不建议自行拆机"

- id: "05"
  problem: "视频会议前 Wi-Fi 突然变卡"
  search: "重启、改信道、恢复出厂设置、更换路由器等方法影响范围不同"
  knowledge: "路由器型号、网络结构、上次有效的处理方法、书房适合的频段以及会议时间"
  want: "优先使用已验证的低风险方案，并准备手机热点兜底；会议前不恢复出厂设置，也不破坏现有智能家居连接"

- id: "06"
  problem: "下班很晚，今晚不知道吃什么"
  search: "菜谱平台能给出几十道快手菜，却不知道家里有什么、两个人吃不吃"
  knowledge: "食材库存与期限、两人的口味、现有厨具以及“20 分钟内完成”的要求"
  want: "从现有食材中给出一个主方案和一个备选，优先消耗临期食材，列出操作顺序、预计时间和真正缺少的材料"

- id: "07"
  problem: "冰箱里几样食材即将过期"
  search: "“清冰箱食谱”不知道用户未来几天是否在家，也不知道食材数量"
  knowledge: "食材数量与日期、哪几天在家吃饭、用餐人数和不喜欢连续吃相似口味的习惯"
  want: "按到期顺序生成几天的消耗计划，自动跳过外出日，并提示哪些库存需要先核对"

- id: "08"
  problem: "下班路上临时去超市采购"
  search: "通用购物清单容易造成重复购买，也可能漏掉真正缺少的东西"
  knowledge: "家中库存、常用品的品牌和规格、消耗速度、近期菜单与外出安排"
  want: "用计划需求减去现有库存，只生成真实缺口；记录较久的物品先提醒确认，不假定它仍在原处或尚未用完"

- id: "09"
  problem: "几位朋友临时来家里吃饭"
  search: "聚餐菜单不了解来客忌口、家中厨具和用户实际会做什么"
  knowledge: "已确认的过敏与偏好、个人菜谱、现有食材、厨具位置和可用时间"
  want: "组合一份能力范围内的菜单，给出采购缺口和并行烹饪顺序；对严重过敏或人数不确定项先确认"

- id: "10"
  problem: "书桌突然松动，不知道拧紧还是换零件"
  search: "教程可能建议加胶、换螺丝或重新打孔，但家具结构各不相同"
  knowledge: "家具型号与安装说明、备用零件、工具位置以及用户不希望钻孔的限制"
  want: "先定位对应连接件和现有工具，按照说明执行非破坏性检查；发现结构损坏时停止继续尝试并建议维修"

- id: "11"
  problem: "明早出差，临睡前才开始收拾行李"
  search: "网上清单为了覆盖所有人往往又长又全，却不知道这次行程目的"
  knowledge: "常用出行清单、证件和设备位置、个人药品以及过去经常漏带的东西"
  want: "根据天数和行程生成“随身携带、装箱、出门前确认”三段清单，并标出物品位置；天气和交通规则需另行核实"

- id: "12"
  problem: "明天面试，不知道衣柜里的衣服怎么搭"
  search: "穿搭示范不了解用户现有单品、身材、舒适度和企业场合"
  knowledge: "衣物材质、正式程度、鞋子舒适度、过往搭配与颜色偏好"
  want: "从现有衣物中组合主方案和备用方案，并列出今晚需要完成的熨烫、去渍和装包检查"

- id: "13"
  problem: "网购衣服时拿不准尺码"
  search: "商品尺码表与评论常常互相矛盾，也不了解用户喜欢宽松还是合身"
  knowledge: "身体尺寸、同品牌试穿记录、面料缩水经验、版型偏好和退货容忍度"
  want: "结合当前商品尺码表与个人历史给出建议尺码、判断依据和不确定点，而不是只说“建议买大一码”"

- id: "14"
  problem: "朋友生日，不知道送什么才不会闲置"
  search: "礼物榜单只能按年龄、性别等宽泛标签推荐"
  knowledge: "朋友提过的兴趣与禁忌、过敏信息、过去送过的礼物、共同经历与预算"
  want: "给出少而精的候选及各自依据，排除重复和高风险选择；较久以前的偏好标记为需要再次确认"

- id: "15"
  problem: "周五要汇报，却不知道两个晚上先做什么"
  search: "番茄钟和汇报模板不了解交付物状态、历史反馈和个人专注时段"
  knowledge: "截止时间、已有材料、上次被指出的问题、工作日作息与高效时间段"
  want: "按“必须完成、提升质量、有余力再做”重排任务，关联现有材料并预留演练时间"

- id: "16"
  problem: "手机充电器坏了，不知道应该买哪种"
  search: "充电功率、接口和协议繁多，商品页的“通用兼容”也未必可靠"
  knowledge: "手机和电脑型号、原装充电器参数、家中备用充电器与线材的位置"
  want: "先判断家中是否已有可用备件；确需购买时列出必须核对的接口、功率和协议，并以官方兼容信息为准"

- id: "17"
  problem: "家电出现问题，想退换或申请保修"
  search: "不同商家、品类和故障的政策不同，网上经验可能已经失效"
  knowledge: "购买日期、订单与发票位置、序列号、保修期、故障照片和历史沟通"
  want: "核对当前售后政策后，生成截止时间、申请渠道和材料清单，并提醒备份数据；不假装已经替用户提交"

- id: "18"
  problem: "办证件前，不确定材料是否准备齐全"
  search: "攻略来源和发布时间不同，要求还可能因地区与业务变化"
  knowledge: "身份证件位置与有效期、照片和复印件、已有证明以及预约时间"
  want: "将最新官方清单与个人现有材料逐项比对，形成“已备齐、需要补办、现场确认”三类清单"

- id: "19"
  problem: "感冒头痛，想知道药箱里的药能否一起吃"
  search: "网页可能直接给出药物搭配和剂量，但不了解个人病史与正在服用的药"
  knowledge: "已记录的过敏史、长期用药、药品名称和位置；部分规格、剂量或期限可能缺失"
  want: "只汇总已确认信息并指出需要核对的包装内容，建议携带信息咨询医生或药师；不自行诊断、推断相互作用或提供剂量"

- id: "20"
  problem: "宠物突然食欲下降，不知道该观察还是就医"
  search: "网上同时存在换粮、喂药、继续观察和立即就医等冲突建议"
  knowledge: "宠物年龄与既往情况、近期饮食变化、驱虫记录、现有食品以及常去医院信息"
  want: "整理已知变化和需要继续观察的项目，提示应及时就医的异常信号并提供医院信息；不擅自诊断或推断用药剂量"
